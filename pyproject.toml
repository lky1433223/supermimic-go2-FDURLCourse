[project]
name = "rl-go2"
version = "0.1.0"
description = "Quadruped reinforcement learning with Genesis and MuJoCo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2.5,<4",
    "numpy>=1.26.4,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
train = [
    "genesis-world>=1.4.5,<2",
    "rsl-rl-lib>=5,<6",
    "torch>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_go2"]

[project.scripts]
rl-go2 = "rl_go2.cli:main"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
