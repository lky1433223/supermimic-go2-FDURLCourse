schema: rl-go2.scene/v1
# Rows run along +X. Columns run along +Y. Zero-height tiles expose the plane.
scene:
  sim_options:
    dt: 0.005
    gravity: [0, 0, -9.81]
  entities:
    - id: ground
      type: plane
      position: [0, 0, 0]
      fixed: true
      friction: 0.8
    - id: rough
      type: rough_ground
      seed: 101
      start_x_m: 0.8
      center_y_m: 0.0
      base_z_m: 0.0
      rows: 5
      columns: 4
      tile_size_m: 0.30
      height_increment_m: 0.01
      max_height_level: 2
      max_adjacent_delta_levels: 1
      friction: 0.8
    - id: go2
      type: mjcf
      robot: true
      file: ../../assets/robots/go2/go2.xml
      position: [0, 0, 0.42]
      rotation: [1, 0, 0, 0]
  sensors: []
