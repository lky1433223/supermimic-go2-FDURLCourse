# Joint dynamics and terrain randomization with weighted episode resets.
scene:
  sim_options:
    dt: 0.005
    gravity: [0, 0, -9.81]
  terrains:
    flat:
      weight: 1
    step:
      weight: 1
      height_range_m: [0.02, 0.06]
      length_m: 0.60
      width_m: 1.20
    stairs:
      weight: 1
      map_count: 1
      step_height_m: 0.05
      tread_depth_m: 0.30
      num_steps: 10
      width_m: 1.20
    ramp:
      weight: 1
      slope_range_deg: [5.0, 10.0]
      run_m: 0.80
      platform_length_m: 0.60
      width_m: 1.20
    rough_ground:
      weight: 1
      map_count: 8
      seed: 201
      rows: 5
      columns: 4
      tile_size_m: 0.30
      height_increment_m: 0.01
      max_height_level: 2
      max_adjacent_delta_levels: 1
robot: ../robots/go2.yaml
robot_overrides:
  joint_position_limits:
    FR_hip_joint: [-0.837758, 0.837758]  # radians, about ±48°
    FL_hip_joint: [-0.837758, 0.837758]
    RR_hip_joint: [-0.837758, 0.837758]
    RL_hip_joint: [-0.837758, 0.837758]
task: ../tasks/flat_walk_vx0.yaml
backend: genesis
device: cuda
num_envs: 4096
seed: 1
curriculum:
  name: none
domain_randomization:
  action_delay_steps: [0, 2]  # Uniform per episode, independent of sensor delay (0, 20 or 40 ms).
  # Unitree Go2 RL Lab uniform-noise bounds, before actor scaling.
  observation_noise:
    frame_delay_steps: [0, 1]  # Uniform per episode, shared across sensors (0 or 20 ms).
    angular_velocity:
      - {type: uniform, low: -0.20, high: 0.20}
    projected_gravity:
      - {type: uniform, low: -0.05, high: 0.05}
    joint_position:
      - {type: uniform, low: -0.01, high: 0.01}
    joint_velocity:
      - {type: uniform, low: -1.50, high: 1.50}
  base_com:
    enabled: true
    offset_ranges_m:
      x: [-0.01, 0.01]
      y: [-0.03, 0.03]
      z: [-0.01, 0.01]
  base_mass:
    enabled: true
    scale_range: [0.9, 1.1]
  foot_ground_friction:
    enabled: true
    base_ranges:
      FR: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      FL: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      RR: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      RL: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
    env_multiplier_range: [0.75, 1.25]
  point_push:
    enabled: true
    no_push_episode_probability: 0.10
    first_wait_seconds: [3.0, 6.0]  # Begins at reset.
    gap_seconds: [3.0, 6.0]         # Begins after the last force ends.
    duration_seconds: [0.10, 0.30]
    targets:
      base:
        probability: 0.80
        force_range_n: [5.0, 200.0]
      foot:
        probability: 0.20
        force_range_n: [2.0, 8.0]   # The four feet are sampled uniformly.
    direction:
      azimuth_range_deg: [0.0, 360.0]
      elevation_range_deg: [-25.0, 25.0]
    overlap:
      probability: 0.0
      second_start_delay_steps: [2, 6]
trainer:
  name: supermimic
  iterations: 40000
  collect_steps: 1
  buffer_steps: 1000
  warmup_iterations: 0
  world_model_warmup_iterations: 1000
  condition_on_link_wrenches: true
  model_hidden: [2048, 2048, 2048]
  actor_hidden: [512, 256, 128]
  critic_hidden: [256, 128]
  model_window: 8
  model_batch: 2048
  model_updates: 10
  imagination_batch: 4096
  horizon: 32
  critic_epochs: 5
  critic_minibatches: 4
  learning_rate: 0.0002
  actor_learning_rate: 0.0002
  tf32: true
  fused_adam: true
  compile_training: true
  cuda_graph: true
  bootstrap_weight: 1.0
  driver_fraction: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  action_noise: 0.1
  height_softness: 0.01
  upright_softness: 0.03
  save_interval: 1000
  log_interval: 10
  driver_policy: null
  behavior_updates: 0
  behavior_weight: 0.0
