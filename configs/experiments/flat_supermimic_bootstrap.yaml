# From-scratch GPU recipe evaluated at iteration 40000; no PPO teacher.
scene: ../scenes/flat.yaml
robot: ../robots/go2.yaml
task: ../tasks/flat_walk.yaml
backend: genesis
device: cuda
num_envs: 4096
seed: 1
curriculum:
  name: none
trainer:
  name: supermimic
  iterations: 40000
  collect_steps: 1
  buffer_steps: 1000
  warmup_iterations: 300
  model_hidden:
  - 1024
  - 1024
  - 1024
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  model_window: 8
  model_batch: 2048
  model_updates: 2
  imagination_batch: 8192
  horizon: 32
  critic_epochs: 5
  critic_minibatches: 4
  learning_rate: 0.0002
  actor_learning_rate: 0.0002
  bootstrap_weight: 1.0
  driver_fraction: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  action_noise: 0.1
  height_softness: 0.01
  upright_softness: 0.03
  save_interval: 1000
  log_interval: 10
  driver_policy: null
  behavior_updates: 0
  behavior_weight: 0.0
