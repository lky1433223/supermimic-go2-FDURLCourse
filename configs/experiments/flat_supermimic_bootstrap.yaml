# From-scratch GPU recipe with the official replay schedule; no PPO teacher.
scene: ../scenes/flat.yaml
robot: ../robots/go2.yaml
task: ../tasks/flat_walk.yaml
backend: genesis
device: cuda
num_envs: 4096
seed: 1
curriculum:
  name: none
domain_randomization:
  base_mass:
    enabled: false
    # Per-environment scale of trunk mass and inertia, fixed across resets.
    scale_range: [0.9, 1.1]
  foot_ground_friction:
    enabled: false
    # Per-foot base bounds, sampled independently per real rollout.
    # Sliding is dimensionless. Torsional and rolling are in meters.
    base_ranges:
      FR: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      FL: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      RR: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
      RL: {sliding: [0.8, 0.8], torsional: [0.02, 0.02], rolling: [0.01, 0.01]}
    # One multiplier per environment, fixed across resets and rollouts.
    env_multiplier_range: [1.0, 1.0]
trainer:
  name: supermimic
  iterations: 40000
  collect_steps: 1
  buffer_steps: 1000
  warmup_iterations: 0
  model_hidden:
  - 2048
  - 2048
  - 2048
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 256
  - 128
  model_window: 8
  model_batch: 2048
  model_updates: 10
  imagination_batch: 4096
  horizon: 32
  critic_epochs: 5
  critic_minibatches: 4
  learning_rate: 0.0002
  actor_learning_rate: 0.0002
  tf32: true
  fused_adam: true
  compile_training: true
  cuda_graph: true
  bootstrap_weight: 1.0
  driver_fraction: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  action_noise: 0.1
  height_softness: 0.01
  upright_softness: 0.03
  save_interval: 1000
  log_interval: 10
  driver_policy: null
  behavior_updates: 0
  behavior_weight: 0.0
