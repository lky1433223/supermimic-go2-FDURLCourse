# Verified warm-start recipe: --driver-policy must explicitly name a compatible
# 45-input/12-output TorchScript Go2 policy. The exported actor has no driver dependency.
scene: ../scenes/flat.yaml
robot: ../robots/go2.yaml
task: ../tasks/flat_walk.yaml
backend: genesis
device: cpu
num_envs: 32
seed: 1
curriculum:
  name: none
trainer:
  name: supermimic
  # Fixed validation protocol showed sim2sim degradation after iteration 1000.
  iterations: 900
  collect_steps: 4
  buffer_steps: 512
  warmup_iterations: 600
  model_hidden: [128, 128]
  actor_hidden: [128, 128]
  critic_hidden: [64, 64]
  model_window: 8
  model_batch: 128
  model_updates: 2
  imagination_batch: 128
  horizon: 32
  learning_rate: 0.0002
  actor_learning_rate: 0.00002
  bootstrap_weight: 0.0
  driver_fraction: 0.5
  behavior_updates: 4
  warmup_learning_rate: 0.001
  behavior_weight: 5.0
  gamma: 0.99
  gae_lambda: 0.95
  action_noise: 0.1
  height_softness: 0.01
  upright_softness: 0.03
  save_interval: 100
  log_interval: 100
