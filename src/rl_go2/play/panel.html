<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Go2 · SuperMimic</title>
<style>
body{background:#10151c;color:#ecf2f9;font:17px system-ui;margin:40px auto;padding:0 24px;max-width:760px}
h1{font-size:32px}p{color:#aebccc;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#1b2531;border-radius:14px;padding:22px}.value{font-size:30px;margin:12px 0}
button{background:#293b50;color:white;border:1px solid #52697f;border-radius:8px;padding:12px 18px;margin:5px;cursor:pointer}
kbd{background:#293b50;padding:3px 7px;border-radius:4px}#connection{color:#7cddb5}small{color:#aebccc}
</style>
<h1>Go2 · SuperMimic</h1><p id="model">正在连接仿真…</p><p id="connection">请保持此页面在前台接收键盘操作</p>
<div class="grid"><div class="card">步行速度档位<div class="value" id="speed">—</div><small>↑ 增加 / ↓ 减少 · m/s</small></div>
<div class="card">转向速度档位<div class="value" id="yaw">—</div><small>← 减少 / → 增加 · rad/s</small></div>
<div class="card">当前指令 vx / yaw<div class="value" id="command">—</div></div>
<div class="card">实际速度 vx / yaw<div class="value" id="actual">—</div></div></div>
<p><kbd>W</kbd> 前进　<kbd>S</kbd> 后退　<kbd>A</kbd> 左转　<kbd>D</kbd> 右转<br>支持组合按键，松开停止。鼠标在原生 3D 窗口调整视角。</p>
<button data-action="stop">Space 停走</button><button data-action="pause">P 暂停 / 继续</button>
<button data-action="reset">R 重置</button><button data-action="quit">Esc 退出</button>
<p id="limits"></p><p id="state"></p><small>1× 真实时间运行。停止指令会将目标速度归零，策略继续维持姿态。</small>
<script>
const keys = new Set();
const actions = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'stop',p:'pause',r:'reset',Escape:'quit'};
let pending = Promise.resolve();
function send(action='') {
 const body=JSON.stringify({keys:[...keys],action});
 pending=pending.catch(()=>{}).then(()=>fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body}));
 return pending;
}
function clear(){keys.clear();send('stop');}
window.addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(!('wasd'.includes(k)&&k.length===1)&&!actions[k])return;
 e.preventDefault();
 if('wasd'.includes(k)&&k.length===1){keys.add(k);send();return;}
 if(e.repeat)return;
 if(['stop','reset','pause','quit'].includes(actions[k]))keys.clear();
 send(actions[k]);
});
window.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());send();});
window.addEventListener('blur',clear);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{keys.clear();send(b.dataset.action);});
const value=(id,text)=>document.getElementById(id).textContent=text;
async function poll(){
 try{
  if(document.hasFocus())await send();
  const response=await fetch('/status');const s=await response.json();
  value('model',`${s.backend} · ${s.policy}`);
  value('speed',s.speed.toFixed(2));value('yaw',s.yaw.toFixed(2));
  value('command',(s.command||[0,0]).map(x=>x.toFixed(2)).join(' / '));
  value('actual',(s.actual||[0,0]).map(x=>x.toFixed(2)).join(' / '));
  value('limits',`速度上限 ±${s.max_speed} m/s · 转向上限 ±${s.max_yaw} rad/s · 训练指令范围 ${JSON.stringify(s.training_ranges)}`);
  value('state',s.stopped?'已退出':s.paused?'已暂停':`运行中 · 仿真 ${(s.seconds||0).toFixed(1)} s`);
  value('connection',document.hasFocus()?'键盘已就绪 · 在此页面操作':'点击此页面启用键盘');
 }catch(e){value('connection','仿真连接已断开');}
 setTimeout(poll,100);
}poll();
</script></html>
